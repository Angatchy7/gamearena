{% extends "base.html" %}

{% block title %}Password Changed — GameArena{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; padding-top: 4rem;">

    <div class="card border-0 shadow-sm text-white text-center"
         style="background: #1e293b; border-radius: 18px; border: 1px solid rgba(34,197,94,0.25) !important;">

        <div class="card-body p-5">

            <div class="rounded-circle mx-auto mb-4 d-flex align-items-center justify-content-center"
                 style="width: 72px; height: 72px; background: rgba(34,197,94,0.15); border: 2px solid rgba(34,197,94,0.4);">
                <i class="bi bi-shield-check-fill text-success fs-2"></i>
            </div>

            <h2 class="fw-bold text-white mb-2">Password Updated!</h2>
            <p class="text-muted mb-4">Your password has been changed successfully. Your account is now secured with the new password.</p>

            <div class="d-grid gap-2">
                <a href="{% url 'accounts:settings' %}" class="btn btn-primary fw-bold py-2.5" style="border-radius: 12px;">
                    <i class="bi bi-arrow-left me-1"></i> Back to Settings
                </a>
                <a href="{% url 'dashboard:home' %}" class="btn btn-outline-light py-2" style="border-radius: 12px;">
                    <i class="bi bi-speedometer2 me-1"></i> Go to Dashboard
                </a>
            </div>

        </div>
    </div>
</div>
{% endblock %}
