{% extends "base.html" %}

{% block title %}Password Reset Complete - GameArena{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-lg p-4 text-center" style="border-radius: 20px; background: var(--ga-card-bg); border: 1px solid var(--ga-border);">
                <div class="card-body">
                    <div class="d-inline-flex align-items-center justify-content-center rounded-3 bg-success text-white p-3 mb-3">
                        <i class="bi bi-check-circle-fill fs-3"></i>
                    </div>
                    <h2 class="fw-bold text-main mb-2">Password Changed!</h2>
                    <p class="text-secondary small mb-4">
                        Your password has been successfully reset. You can now sign in with your new password.
                    </p>
                    <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-2.5 fw-bold rounded-3">
                        SIGN IN NOW
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
