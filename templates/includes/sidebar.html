<div class="ga-sidebar d-flex flex-column">

    <!-- Logo -->
    <div class="sidebar-header text-center mb-4">

        <div class="sidebar-logo mx-auto mb-3">
            <i class="bi bi-controller"></i>
        </div>

        <h4 class="text-white fw-bold mb-0">
            GameArena
        </h4>

        <small class="text-secondary">
            Esports Platform
        </small>

    </div>

    <!-- Navigation -->
    <div class="sidebar-menu flex-grow-1">

        <!-- HOME -->
        <small class="menu-title" style="color: #94a3b8; font-weight: 700; letter-spacing: 0.1em;">
            HOME
        </small>

        <a href="{% url 'core:home' %}" class="sidebar-link {% if request.resolver_match.namespace == 'core' and request.resolver_match.url_name == 'home' %}active{% endif %}">
            <i class="bi bi-house-door-fill"></i>
            <span>Home</span>
        </a>

        <a href="{% url 'dashboard:home' %}" class="sidebar-link {% if request.resolver_match.namespace == 'dashboard' %}active{% endif %}">
            <i class="bi bi-speedometer2"></i>
            <span>Dashboard</span>
        </a>

        <hr>

        <!-- TEAMS -->
        <small class="menu-title" style="color: #94a3b8; font-weight: 700; letter-spacing: 0.1em;">
            TEAMS
        </small>

        <a href="{% url 'teams:list' %}" class="sidebar-link {% if request.resolver_match.namespace == 'teams' and request.resolver_match.url_name == 'list' %}active{% endif %}">
            <i class="bi bi-shield-fill"></i>
            <span>My Teams</span>
        </a>

        <a href="{% url 'teams:joined' %}" class="sidebar-link {% if request.resolver_match.namespace == 'teams' and request.resolver_match.url_name == 'joined' %}active{% endif %}">
            <i class="bi bi-people-fill"></i>
            <span>Joined Teams</span>
        </a>

        <a href="{% url 'teams:create' %}" class="sidebar-link sidebar-action {% if request.resolver_match.namespace == 'teams' and request.resolver_match.url_name == 'create' %}active{% endif %}">
            <i class="bi bi-plus-circle-fill"></i>
            <span>Create Team</span>
        </a>

        <hr>

        <!-- TOURNAMENTS -->
        <small class="menu-title" style="color: #94a3b8; font-weight: 700; letter-spacing: 0.1em;">
            TOURNAMENTS
        </small>

        <a href="{% url 'tournaments:list' %}" class="sidebar-link {% if request.resolver_match.namespace == 'tournaments' and request.resolver_match.url_name == 'list' %}active{% endif %}">
            <i class="bi bi-trophy-fill"></i>
            <span>Browse</span>
        </a>

        <a href="{% url 'tournaments:my_list' %}" class="sidebar-link {% if request.resolver_match.namespace == 'tournaments' and request.resolver_match.url_name == 'my_list' %}active{% endif %}">
            <i class="bi bi-grid-fill"></i>
            <span>My Tournaments</span>
        </a>

        <a href="{% url 'tournaments:create' %}" class="sidebar-link sidebar-action {% if request.resolver_match.namespace == 'tournaments' and request.resolver_match.url_name == 'create' %}active{% endif %}">
            <i class="bi bi-plus-circle-fill"></i>
            <span>Create Tournament</span>
        </a>

        <a href="{% url 'core:games' %}" class="sidebar-link {% if request.resolver_match.namespace == 'core' and request.resolver_match.url_name == 'games' %}active{% endif %}">
            <i class="bi bi-controller"></i>
            <span>Games</span>
        </a>

        <hr>

        <!-- ACCOUNT -->
        <small class="menu-title" style="color: #94a3b8; font-weight: 700; letter-spacing: 0.1em;">
            ACCOUNT
        </small>

        <a href="{% url 'notifications:list' %}" class="sidebar-link {% if request.resolver_match.namespace == 'notifications' %}active{% endif %}">
            <i class="bi bi-bell-fill"></i>
            <span>Notifications</span>
        </a>

        <a href="{% url 'accounts:settings' %}" class="sidebar-link {% if request.resolver_match.namespace == 'accounts' and request.resolver_match.url_name == 'settings' %}active{% endif %}">
            <i class="bi bi-gear-fill"></i>
            <span>Settings</span>
        </a>

        <form method="post" action="{% url 'accounts:logout' %}" class="m-0">
            {% csrf_token %}
            <button type="submit" class="sidebar-link sidebar-action border-0 bg-transparent w-100 text-start" style="cursor: pointer;">
                <i class="bi bi-box-arrow-right"></i>
                <span>Logout</span>
            </button>
        </form>

    </div>

</div>
