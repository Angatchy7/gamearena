<div class="ga-page-header">

    <div>

        <h2 class="ga-page-title">
            {% block page_title %}{{ title }}{% endblock %}
        </h2>

        {% if subtitle %}
        <p class="ga-page-subtitle">
            {{ subtitle }}
        </p>
        {% endif %}

    </div>

    {% if action_url %}
    <a href="{{ action_url }}" class="btn btn-primary">
        <i class="{{ action_icon }}"></i>
        {{ action_text }}
    </a>
    {% endif %}

</div>
