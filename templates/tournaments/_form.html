<div class="card shadow-sm border-0 tournament-form-card tournament-form" style="background: #18243a !important;">
    <div class="card-body p-4">

        {% csrf_token %}

        {% for field in form %}

        <div class="mb-3.5">

            <label for="{{ field.id_for_label }}" class="form-label text-light fw-semibold mb-1" style="color: #e2e8f0 !important; font-size: 0.95rem;">
                {{ field.label }}
                {% if field.field.required %}
                    <span class="text-danger ms-0.5">*</span>
                {% endif %}
            </label>

            {{ field }}

            {% if field.help_text %}
            <div class="form-text" style="color: #94a3b8 !important;">
                {{ field.help_text }}
            </div>
            {% endif %}

            {% if field.errors %}
            <div class="text-danger small mt-1 fw-medium" style="color: #f87171 !important;">
                {{ field.errors }}
            </div>
            {% endif %}

        </div>

        {% endfor %}

        <button type="submit" class="btn btn-primary btn-lg fw-bold px-4 py-2.5 mt-3 shadow-sm">
            <i class="bi bi-check-circle me-1.5"></i> Save Tournament
        </button>

    </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    const partSelect = document.getElementById("id_participation_type");
    const teamSizeInput = document.getElementById("id_team_size");
    if (partSelect && teamSizeInput) {
        function updateTeamSize() {
            if (partSelect.value === "SOLO") {
                teamSizeInput.value = 1;
                teamSizeInput.readOnly = true;
            } else {
                teamSizeInput.readOnly = false;
            }
        }
        partSelect.addEventListener("change", updateTeamSize);
        updateTeamSize();
    }
});
</script>
