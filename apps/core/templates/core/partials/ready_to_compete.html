<section class="py-3.5 py-lg-4 position-relative">
    <div class="container">
        <div class="card border-0 text-white overflow-hidden shadow-lg p-3.5 p-md-4" 
             style="background: var(--ga-card-bg, #1e293b); border-radius: 16px; border: 1px solid var(--ga-border, rgba(255, 255, 255, 0.12)) !important;">
            
            <div class="row align-items-center g-4">
                <!-- Left Title & Copy -->
                <div class="col-lg-5">
                    <div class="d-flex align-items-start gap-3">
                        <div class="rounded-3 p-3 flex-shrink-0 d-flex align-items-center justify-content-center bg-primary text-white shadow-sm" style="width: 52px; height: 52px;">
                            <i class="bi bi-people-fill fs-3"></i>
                        </div>
                        <div>
                            <h4 class="fw-extrabold text-white mb-1 fs-4">
                                Ready to Compete?
                            </h4>
                            <p class="text-white-50 small mb-0" style="font-size: 0.82rem; line-height: 1.45;">
                                Create a team with your friends or start your own journey in high-stakes tournaments on GameArena.
                            </p>
                        </div>
                    </div>
                </div>

                <!-- Right Action Cards -->
                <div class="col-lg-7">
                    <div class="d-flex flex-sm-row flex-column gap-3">
                        <!-- Create Team Card -->
                        <a href="{% url 'teams:create' %}" class="p-3 rounded-3 flex-fill text-decoration-none d-flex align-items-center justify-content-between gap-3 ga-hover-scale" 
                             style="background: rgba(15, 23, 42, 0.70); border: 1px solid rgba(255, 255, 255, 0.12);">
                            <div class="d-flex align-items-center gap-3">
                                <div class="rounded-circle d-flex align-items-center justify-content-center bg-primary bg-opacity-20 text-cyan" style="width: 40px; height: 40px;">
                                    <i class="bi bi-people-fill fs-5"></i>
                                </div>
                                <div>
                                    <h6 class="fw-bold text-white mb-0" style="font-size: 0.92rem;">Create Team</h6>
                                    <small class="text-white-50 d-block" style="font-size: 0.73rem;">Build your team, invite players</small>
                                </div>
                            </div>
                            <div class="btn btn-sm btn-primary rounded-circle p-0 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                <i class="bi bi-chevron-right fs-6"></i>
                            </div>
                        </a>

                        <!-- Create Tournament Card -->
                        <a href="{% url 'tournaments:create' %}" class="p-3 rounded-3 flex-fill text-decoration-none d-flex align-items-center justify-content-between gap-3 ga-hover-scale" 
                             style="background: rgba(15, 23, 42, 0.70); border: 1px solid rgba(255, 255, 255, 0.12);">
                            <div class="d-flex align-items-center gap-3">
                                <div class="rounded-circle d-flex align-items-center justify-content-center bg-warning bg-opacity-20 text-warning" style="width: 40px; height: 40px;">
                                    <i class="bi bi-trophy-fill fs-5"></i>
                                </div>
                                <div>
                                    <h6 class="fw-bold text-white mb-0" style="font-size: 0.92rem;">Create Tournament</h6>
                                    <small class="text-white-50 d-block" style="font-size: 0.73rem;">Host your tournament</small>
                                </div>
                            </div>
                            <div class="btn btn-sm btn-primary rounded-circle p-0 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                                <i class="bi bi-chevron-right fs-6"></i>
                            </div>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
