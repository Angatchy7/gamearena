<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="val-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#18181b"/>
      <stop offset="80%" stop-color="#881337"/>
      <stop offset="100%" stop-color="#ff4655"/>
    </linearGradient>
    <linearGradient id="val-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4655"/>
      <stop offset="100%" stop-color="#fda4af"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#val-bg)"/>

  <!-- Geometric Sharp Slash Lines -->
  <polygon points="500,0 800,0 800,450 350,450" fill="#ff4655" opacity="0.15"/>
  <polygon points="550,0 620,0 420,450 350,450" fill="#ff4655" opacity="0.3"/>

  <!-- Valorant V Logo Emblem -->
  <g transform="translate(520, 100)">
    <path d="M 0,0 L 90,190 L 140,190 L 50,0 Z" fill="#ff4655"/>
    <path d="M 160,0 L 220,0 L 220,190 Z" fill="#ece8e1"/>
  </g>

  <!-- Typography -->
  <g transform="translate(70, 230)">
    <rect x="0" y="-35" width="150" height="30" rx="4" fill="#ff4655"/>
    <text x="12" y="-14" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="3">TACTICAL FPS</text>
    
    <text x="0" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="68" fill="#ece8e1" letter-spacing="6">VALORANT</text>
    <text x="0" y="88" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" fill="#ff4655" letter-spacing="5">5V5 CHARACTER-BASED TACTICAL SHOOTER</text>
  </g>
</svg>
