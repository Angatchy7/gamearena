    <text x="12" y="-14" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="3">VEHICULAR SOCCER</text>
    
    <text x="0" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" fill="#ffffff" letter-spacing="3">ROCKET LEAGUE</text>
  </g>
