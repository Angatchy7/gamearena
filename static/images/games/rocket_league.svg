<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="rl-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712"/>
      <stop offset="45%" stop-color="#1e1b4b"/>
      <stop offset="80%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#rl-bg)"/>

  <!-- Rocket Boost & Ball Graphic -->
  <circle cx="580" cy="180" r="70" fill="none" stroke="#f97316" stroke-width="8" opacity="0.6"/>
