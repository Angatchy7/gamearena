<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="cs2-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="45%" stop-color="#1c1917"/>
      <stop offset="80%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#cs2-bg)"/>

  <!-- Counter-Strike CT Silhouette Graphic -->
  <g transform="translate(480, 80)" opacity="0.3">
    <path d="M120,40 L160,80 L140,240 L80,260 L40,160 Z" fill="#ea580c"/>
    <circle cx="120" cy="50" r="35" fill="#f97316"/>
  </g>

  <!-- Typography & CS2 Logo -->
  <g transform="translate(70, 230)">
    <rect x="0" y="-35" width="165" height="30" rx="4" fill="#ea580c"/>
    <text x="12" y="-14" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="14" fill="#ffffff" letter-spacing="3">TACTICAL SHOOTER</text>
    
    <text x="0" y="45" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="56" fill="#ffffff" letter-spacing="2">COUNTER-STRIKE</text>
    <text x="0" y="95" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="50" fill="#fdba74" letter-spacing="6">CS2</text>
  </g>
</svg>
